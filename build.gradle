buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'biz.aQute.bnd:biz.aQute.bnd.gradle:7.3.0'
  }
}

plugins {
  id 'java-library'
  id 'jacoco'
  id 'signing'
  id 'maven-publish'
  id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
  id 'com.github.ben-manes.versions' version '0.54.0'
}
apply plugin: 'biz.aQute.bnd.builder'


def getDevVersionName() {
  try {
    def output = providers.exec {
      executable 'git'
      args = ['describe', '--tags']
    }.standardOutput.asText.get().trim()
    // strip of leading "v"
    return output.substring(1)
  } catch (ignore) {
    println(ignore)
    logger.info('Error running git describe (' + ignore + '), defaulting to 0.0.0')
    return '0.0.0'
  }
}

def getVersionName() {
  try {
    def output = providers.exec {
      executable 'git'
      args = ['describe', '--tags', '--abbrev=0']
    }.standardOutput.asText.get().trim()
    // strip of leading "v"
    output = output.substring(1)
  } catch (ignore) {
    println(ignore)
    logger.info('Error running git describe (' + ignore + '), defaulting to 0.0.0')
    return '0.0.0'
  }
}

project.group = 'org.pharmgkb'
// always use base version to reduce churn with IDEA's external.system.module.version
project.version = getVersionName()

ext {
  baseName = 'vcf-parser'
  moduleName = 'org.pharmgkb.parser.vcf'
  description = 'A streaming parser and writer for VCF 4.x (target specification VCF 4.3).'
  url = 'https://github.com/PharmGKB/vcf-parser.git'
  scm = 'scm:git@github.com:PharmGKB/vcf-parser.git'
  orgName = 'PharmGKB'
  orgUrl = 'https://www.pharmgkb.org'
  // grab properties from environment for CI
  sonatypeUser = project.hasProperty('ossrhUsername') ? ossrhUsername : System.getenv('OSSRH_USERNAME')
  sonatypePwd  = project.hasProperty('ossrhPassword') ? ossrhPassword : System.getenv('OSSRH_PASSWORD')
  sonatypeStagingProfileId = project.hasProperty('ossrhStagingProfileId') ? ossrhStagingProfileId : System.getenv('OSSRH_STAGING_PROFILE_ID')
}

// cannot modify signing directly, have to do it like this
// reference: https://getstream.io/blog/publishing-libraries-to-mavencentral-2021/
ext['signing.keyId'] = ''
ext['signing.password'] = ''
ext['signing.secretKeyRingFile'] = ''
if (System.getenv('SIGNING_KEY')) {
  ext['signing.key'] =  System.getenv('SIGNING_KEY')
  ext['signing.password'] = System.getenv('SIGNING_PASSWORD')
}  else if (project.hasProperty('gpg.key')) {
  ext['signing.key'] =  project.getProperty('gpg.key')
  ext['signing.password'] = project.getProperty('gpg.password')
}  else if (project.hasProperty('gpg.keyId')) {
  ext['signing.keyId'] =  project.getProperty('gpg.keyId')
  ext['signing.password'] = project.getProperty('gpg.password')
  ext['signing.secretKeyRingFile'] =  project.getProperty('gpg.secretKeyRingFile')
} else if (System.getenv('SIGNING_KEY_ID') != null) {
  ext['signing.keyId'] =  System.getenv('SIGNING_KEY_ID')
  ext['signing.password'] = System.getenv('SIGNING_PASSWORD')
  ext['signing.secretKeyRingFile'] =  System.getenv('SIGNING_SECRET_KEY_RING_FILE')
}


repositories {
  mavenCentral()
}

dependencies {
  api(
      'com.google.guava:guava:33.6.0-jre',
      'org.apache.commons:commons-lang3:3.20.0',
      'org.slf4j:slf4j-api:2.0.18'
  )
  compileOnlyApi 'org.jspecify:jspecify:1.0.0'
  compileOnlyApi 'com.google.errorprone:error_prone_annotations:2.47.0'

  testImplementation(
      'ch.qos.logback:logback-classic:1.6.0',
      'org.hamcrest:hamcrest:3.0',
      'org.jsoup:jsoup:1.22.2',
      'org.junit.jupiter:junit-jupiter:6.1.2',
      'org.junit.platform:junit-platform-launcher:6.1.2',
      'org.pharmgkb:pgkb-common:0.7.3',
  )
}

java {
  sourceCompatibility = JavaVersion.VERSION_17
  targetCompatibility = JavaVersion.VERSION_17
}

// hts-specs conformance test (see README.md's "hts-specs conformance test" section for rationale and known state)
ext {
  htsSpecsPinnedSha = 'da617203a9527537746e200abda2885bec3a822c'
  htsSpecsCheckoutDir = layout.buildDirectory.dir('hts-specs-checkout')
}

tasks.register('htsSpecsCheckout') {
  doLast {
    def checkoutDir = htsSpecsCheckoutDir.get().asFile
    if (!new File(checkoutDir, '.git').exists()) {
      logger.lifecycle("Cloning hts-specs (test/vcf only) into ${checkoutDir}...")
      providers.exec {
        executable 'git'
        args = ['clone', '--filter=blob:none', '--sparse', '--no-checkout',
            'https://github.com/samtools/hts-specs.git', checkoutDir.absolutePath]
      }.result.get()

      providers.exec {
        executable 'git'
        args = ['-C', checkoutDir.absolutePath, 'sparse-checkout', 'set', 'test/vcf']
      }.result.get()
    }

    providers.exec {
      executable 'git'
      args = ['-C', checkoutDir.absolutePath, 'fetch', 'origin', 'master']
    }.result.get()

    // Always reconcile the working tree to the currently-configured pin -- not just on first clone -- so that
    // bumping htsSpecsPinnedSha takes effect on the next run without deleting the checkout directory. The fetch
    // above guarantees the pinned commit's object is available locally even if it's newer than what was
    // originally cloned; --filter=blob:none (not --depth) retains full history, so checking out an arbitrary
    // historical pinned SHA always works.
    providers.exec {
      executable 'git'
      args = ['-C', checkoutDir.absolutePath, 'checkout', htsSpecsPinnedSha]
    }.result.get()

    def fetchedSha = providers.exec {
      executable 'git'
      args = ['-C', checkoutDir.absolutePath, 'rev-parse', 'FETCH_HEAD']
    }.standardOutput.asText.get().trim()

    if (fetchedSha != htsSpecsPinnedSha) {
      def changedLog = providers.exec {
        executable 'git'
        args = ['-C', checkoutDir.absolutePath, 'log', "${htsSpecsPinnedSha}..${fetchedSha}",
            '--oneline', '--', 'test/vcf']
      }.standardOutput.asText.get().trim()
      if (!changedLog.isEmpty()) {
        logger.warn("hts-specs has commits touching test/vcf since the pinned commit " +
            "${htsSpecsPinnedSha}:\n${changedLog}\n" +
            "Consider bumping htsSpecsPinnedSha in build.gradle if these fixtures should be picked up.")
      }
    }
  }
}

tasks.register('htsSpecsTest', Test) {
  dependsOn htsSpecsCheckout
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'hts-specs'
  }
  systemProperty 'htsSpecsDir', htsSpecsCheckoutDir.get().asFile.absolutePath

  // This task used to say nothing at all on success, which made a pass indistinguishable from a task that
  // never ran -- and BUILD SUCCESSFUL was routinely misread as evidence the conformance gate had held.
  //
  // Echo the numbers the report actually contains, read back out of summary.md, rather than a bare "OK":
  // a success line carrying no evidence is worse than silence, because it invites exactly the inference it
  // is meant to prevent. summary.md remains authoritative -- it is what this reads -- and is still the place
  // to go for the per-version breakdown.
  //
  // Absence of this line never means "passed quietly". doLast does not run when the task fails (failure is
  // already loud and points at findings.tsv), nor when the task is UP-TO-DATE, in which case nothing was
  // executed and there is no fresh result to report.
  doLast {
    def reportsDir = layout.buildDirectory.dir('reports/hts-specs-conformance').get()
    def summaryFile = reportsDir.file('summary.md').asFile
    def findingsFile = reportsDir.file('findings.tsv').asFile
    if (!summaryFile.exists()) {
      logger.warn("hts-specs conformance: tests passed but ${summaryFile} is missing -- cannot report the counts")
      return
    }
    def lines = summaryFile.readLines()
    def total = lines.find { it.startsWith('| **Total**') }
    def matcher = total =~ /\*\*(\d+)\*\*\s*\|\s*\*\*(\d+)\*\*\s*\|\s*\*\*(\d+)\*\*/
    if (!matcher.find()) {
      logger.warn("hts-specs conformance: tests passed but could not parse the total row in ${summaryFile}")
      return
    }
    // Per-version rows are "| <version> | <check> | <total> | <matches> | <new/stale> |". The suite fails on a
    // non-zero new/stale count, so this is expected to be empty -- reported anyway so the line is self-checking
    // rather than asserting a conclusion the reader has to take on trust.
    def movedRows = lines.findAll { it.startsWith('| 4.') && !(it =~ /\|\s*0\s*\|\s*$/) }
    def findingsLines = findingsFile.exists() ? findingsFile.readLines().size() : -1
    logger.lifecycle("hts-specs conformance: ${matcher.group(2)}/${matcher.group(1)} checks match baseline, " +
        "${matcher.group(3)} new/stale, ${movedRows.size()} per-version row(s) moved, " +
        "findings.tsv ${findingsLines} line(s) (header only when clean). Full report: ${summaryFile}")
  }
}

tasks.register('htsSpecsUpdateBaseline', Test) {
  dependsOn htsSpecsCheckout
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'hts-specs'
  }
  systemProperty 'htsSpecsDir', htsSpecsCheckoutDir.get().asFile.absolutePath
  systemProperty 'htsSpecsUpdateBaseline', 'true'
}

tasks.register('bcftoolsDependencyTest', Test) {
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  useJUnitPlatform {
    includeTags 'bcftools-dependency'
  }

  // Silent on success for the same reason htsSpecsTest was, but this task writes no conformance report, so
  // the useful signal is simply how many bcftools-informed decisions were re-verified against the installed
  // binary. Counted from the JUnit XML the run itself produced, matching htsSpecsTest's read-the-artifact
  // approach -- and deliberately NOT via afterSuite/addTestListener, which Gradle 9 deprecates for removal.
  // Same doLast semantics: no line on failure (already loud) and none when UP-TO-DATE (nothing executed).
  def junitXmlDir = reports.junitXml.outputLocation
  doLast {
    def xmlFiles = junitXmlDir.get().asFile.listFiles({ f -> f.name.startsWith('TEST-') && f.name.endsWith('.xml') } as FileFilter)
    if (xmlFiles == null || xmlFiles.length == 0) {
      logger.warn('bcftools dependency check: tests passed but no JUnit XML was found -- cannot report the count')
      return
    }
    int tests = 0
    int skipped = 0
    xmlFiles.each { f ->
      def suite = new groovy.xml.XmlSlurper().parse(f)
      tests += (suite.@tests.text() ?: '0') as int
      skipped += (suite.@skipped.text() ?: '0') as int
    }
    logger.lifecycle("bcftools dependency check: ${tests - skipped} decision(s) re-verified against the " +
        "installed bcftools (indexed in BCFTOOLS_VERSION_DEPENDENCIES.md)")
  }
}

test {
  // pgkb-build.gradle's tasks.withType(Test).configureEach { useJUnitPlatform() } also applies to this task (lazily,
  // so it may run before or after this block); this works because repeated useJUnitPlatform() calls layer their
  // JUnitPlatformOptions instead of resetting them.
  useJUnitPlatform {
    excludeTags 'hts-specs'
    excludeTags 'bcftools-dependency'
  }
}

apply from: 'pgkb-build.gradle'

// Strip JSpecify and error-prone annotations (both compileOnlyApi) from the generated POM. Gradle's default
// is NOT to omit compileOnlyApi deps -- it publishes them as <scope>compile</scope>, indistinguishable from
// api, which would put the annotation jar on a downstream Maven consumer's runtime classpath. Maven has no
// compileOnlyApi equivalent, and pom.withXml is the only supported way to drop a dependency, so we remove
// the elements outright. Gradle consumers are unaffected: Gradle Module Metadata still exposes both via the
// apiElements variant (and correctly omits them from runtimeElements).
// Must stay after `apply from: 'pgkb-build.gradle'`, which defines the 'release' publication.
publishing {
  publications {
    named('release', MavenPublication) {
      pom.withXml {
        def allDeps = asNode().dependencies.dependency
        allDeps.findAll { dep ->
          (dep.groupId.text() == 'org.jspecify' && dep.artifactId.text() == 'jspecify') ||
              (dep.groupId.text() == 'com.google.errorprone' && dep.artifactId.text() == 'error_prone_annotations')
        }.each { it.parent().remove(it) }
      }
    }
  }
}
